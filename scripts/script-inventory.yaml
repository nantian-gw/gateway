scripts:
  - path: scripts/archive-conformance-report.sh
    class: evidence
    purpose: Archive a Gateway API conformance report into the reports/conformance metadata layout.
    owner: release
    documented: true
  - path: scripts/audit-controlplane-rbac.sh
    class: audit
    purpose: Compare the controlplane RBAC manifests with the required RBAC baseline.
    owner: security
    documented: true
  - path: scripts/audit-gateway-api-bundle.sh
    class: audit
    purpose: Inspect Gateway API CRD bundle and GatewayClass support status in a cluster.
    owner: gateway-api
    documented: true
  - path: scripts/audit-vendored-upstream.sh
    class: audit
    purpose: Verify vendored Aether/runtime sources are not reintroduced.
    owner: dataplane
    documented: true
  - path: scripts/build-kind-runtime-images-local.sh
    class: candidate
    purpose: Build local runtime images for Kind workflows with the production dataplane allocator default.
    owner: kind
    documented: true
  - path: scripts/build-wasm-examples.sh
    class: stable
    purpose: Build Wasm example plugins (hello-plugin, auth-plugin) and prebuilt modules for wasm32-wasi.
    owner: dataplane
    documented: true
  - path: scripts/check-community-governance-contract.sh
    class: check
    purpose: Verify public community governance docs and policy entrypoints stay aligned.
    owner: docs
    documented: true
  - path: scripts/check-dependabot-alert-triage.sh
    class: audit
    purpose: Verify open GitHub Dependabot alerts have repository triage evidence.
    owner: security
    documented: true
  - path: scripts/check-evidence-reference-alignment.sh
    class: check
    purpose: Verify release evidence references point at current archived reports.
    owner: release
    documented: true
  - path: scripts/check-gateway-api-version-alignment.sh
    class: check
    purpose: Verify Gateway API version constants and docs stay aligned.
    owner: gateway-api
    documented: true
  - path: scripts/check-admin-api-drift.sh
    class: check
    purpose: Verify admin API route contract matches machine-readable surface doc and user docs.
    owner: admin-api
    documented: true
  - path: scripts/check-metrics-cardinality-contract.sh
    class: check
    purpose: Verify metrics cardinality docs, Prometheus docs, and Grafana golden signal query semantics stay aligned.
    owner: observability
    documented: true
  - path: scripts/check-rust-unwraps.sh
    class: check
    purpose: Guard against disallowed unwrap or expect usage in Rust production paths.
    owner: dataplane
    documented: true
  - path: scripts/check-script-inventory.sh
    class: check
    purpose: Verify every script and helper has inventory metadata and documentation coverage.
    owner: developer-experience
    documented: true
  - path: scripts/check-stream-route-test-coverage.sh
    class: check
    purpose: Verify stream Route supplemental coverage remains tested and documented.
    owner: gateway-api
    documented: true
  - path: scripts/clean-artifacts.sh
    class: stable
    purpose: Safely clean local temporary, build, and Next.js artifacts (tmp/, target/, dataplane/target/, dashboard/.next/) while preserving reports.
    owner: developer-experience
    documented: true
  - path: scripts/collect-admin-snapshots.sh
    class: evidence
    purpose: Collect controlplane and dataplane admin snapshots and optional metrics.
    owner: observability
    documented: true
  - path: scripts/compare-performance-runs.sh
    class: evidence
    purpose: Compare performance run summaries with percentage thresholds and absolute noise floors.
    owner: performance
    documented: true
  - path: scripts/doctor.sh
    class: stable
    purpose: Check required and recommended local development tools.
    owner: developer-experience
    documented: true
  - path: scripts/generate-proto.sh
    class: stable
    purpose: Generate controlplane Go proto bindings from proto definitions.
    owner: proto
    documented: true
  - path: scripts/install-proto-tools.sh
    class: stable
    purpose: Install Go protobuf generator tools used by make proto.
    owner: proto
    documented: true
  - path: scripts/lib/conformance-report.sh
    class: internal
    purpose: Shared conformance report parsing helpers.
    owner: conformance
    documented: true
  - path: scripts/lib/common.sh
    class: internal
    purpose: Shared shell bootstrap, logging, validation, and safe filesystem helpers.
    owner: developer-experience
    documented: true
  - path: scripts/lib/kind-evidence.sh
    class: internal
    purpose: Shared Kind evidence collection helpers.
    owner: kind
    documented: true
  - path: scripts/lib/kind-image-sync.sh
    class: internal
    purpose: Shared Kind/local-registry image synchronization helpers.
    owner: kind
    documented: true
  - path: scripts/lib/performance-common.sh
    class: internal
    purpose: Shared performance benchmark helpers (log, require_command, write_metadata).
    owner: performance
    documented: true
  - path: scripts/prepare-canary-gatewayclass.sh
    class: stable
    purpose: Prepare a canary GatewayClass from the stable class.
    owner: release
    documented: true
  - path: scripts/prepare-release-assets.sh
    class: stable
    purpose: Package release install manifests, checksums, and release docs.
    owner: release
    documented: true
  - path: scripts/publish-conformance-reports.sh
    class: evidence
    purpose: Publish archived conformance reports to the conformance reports branch.
    owner: conformance
    documented: true
  - path: scripts/refresh-release-evidence.sh
    class: evidence
    purpose: Refresh release evidence summaries and marker-managed docs.
    owner: release
    documented: true
  - path: scripts/render-release-manifest.sh
    class: stable
    purpose: Render release install manifests with concrete image references.
    owner: release
    documented: true
  - path: scripts/rollback-canary-gatewayclass.sh
    class: stable
    purpose: Roll Gateways back from a canary GatewayClass.
    owner: release
    documented: true
  - path: scripts/run-controlplane-status-bench.sh
    class: evidence
    purpose: Run local controlplane status benchmark evidence.
    owner: controlplane
    documented: true
  - path: scripts/run-dataplane-guardrails.sh
    class: audit
    purpose: Run dataplane dependency and runtime source guardrails.
    owner: dataplane
    documented: true
  - path: scripts/run-dataplane-perf-baseline.sh
    class: evidence
    purpose: Run local dataplane performance baseline evidence.
    owner: performance
    documented: true
  - path: scripts/run-dataplane-throughput-baseline.sh
    class: evidence
    purpose: Generate dataplane throughput baseline reports from collected evidence.
    owner: performance
    documented: true
  - path: scripts/run-dataplane-reload-bench.sh
    class: evidence
    purpose: Run dataplane reload, xDS apply, and TLS rotation benchmarks.
    owner: dataplane
    documented: true
  - path: scripts/run-kind-a4-baseline.sh
    class: evidence
    purpose: Run Kind A4 HTTP/gRPC/WebSocket/SSE/MCP/TCP/UDP performance evidence.
    owner: performance
    documented: true
  - path: scripts/run-kind-fault-injection.sh
    class: evidence
    purpose: Run Kind fault injection evidence.
    owner: resilience
    documented: true
  - path: scripts/run-kind-soak.sh
    class: evidence
    purpose: Run Kind soak evidence.
    owner: resilience
    documented: true
  - path: scripts/run-release-validation.sh
    class: stable
    purpose: Run the release candidate validation baseline.
    owner: release
    documented: true
  - path: scripts/run-security-scans.sh
    class: audit
    purpose: Run the repository security scan bundle, excluding ignored local artifacts by default.
    owner: security
    documented: true
  - path: scripts/run-skew-validation.sh
    class: stable
    purpose: Validate proto and adjacent-release skew compatibility.
    owner: proto
    documented: true
  - path: scripts/run-targeted-validation.sh
    class: stable
    purpose: Select the cheapest validation commands for the current diff.
    owner: developer-experience
    documented: true
  - path: scripts/update-gateway-api-support.sh
    class: stable
    purpose: Update or check generated Gateway API support matrix sections.
    owner: gateway-api
    documented: true
  - path: scripts/verify-release-evidence.sh
    class: evidence
    purpose: Verify release evidence directories and metadata are usable.
    owner: release
    documented: true
