apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: nantian-gw
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: nantian-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: m.daocloud.io/docker.io/hashicorp/http-echo:1.0.0
          args:
            - "-listen=:8080"
            - "-text=nantian-gw-ok"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-echo
  namespace: nantian-gw
spec:
  selector:
    app: grpc-echo
  ports:
    - name: grpc
      port: 8080
      targetPort: 3000
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-echo
  namespace: nantian-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-echo
  template:
    metadata:
      labels:
        app: grpc-echo
    spec:
      containers:
        - name: grpc-echo
          image: localhost:5001/gateway-api-conformance/echo-basic:smoke
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GRPC_ECHO_SERVER
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: tls-backend
  namespace: nantian-gw
spec:
  selector:
    app: tls-backend
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-backend
  namespace: nantian-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tls-backend
  template:
    metadata:
      labels:
        app: tls-backend
    spec:
      containers:
        - name: tls-backend
          image: localhost:5001/gateway-api-conformance/echo-basic:smoke
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TLS_SERVER_CERT
              value: /etc/smoke-tls/tls.crt
            - name: TLS_SERVER_PRIVKEY
              value: /etc/smoke-tls/tls.key
          volumeMounts:
            - name: smoke-tls
              mountPath: /etc/smoke-tls
              readOnly: true
      volumes:
        - name: smoke-tls
          secret:
            secretName: smoke-tls-passthrough-certificate
---
apiVersion: v1
kind: Service
metadata:
  name: coredns
  namespace: nantian-gw
spec:
  selector:
    app: udp
  ports:
    - name: udp-dns
      protocol: UDP
      port: 53
      targetPort: 53
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: nantian-gw
data:
  Corefile: |
    .:53 {
        forward . 8.8.8.8 9.9.9.9
        log
        errors
    }
    foo.bar.com:53 {
      whoami
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: nantian-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udp
  template:
    metadata:
      labels:
        app: udp
    spec:
      containers:
        - name: coredns
          image: localhost:5001/gateway-api-conformance/coredns:smoke
          args:
            - -conf
            - /root/Corefile
          volumeMounts:
            - name: conf
              mountPath: /root
      volumes:
        - name: conf
          configMap:
            name: coredns
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nantian
spec:
  controllerName: gateway.networking.k8s.io/nantian-gw
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: nantian-gw
spec:
  gatewayClassName: nantian
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: tcp
      protocol: TCP
      port: 9000
      allowedRoutes:
        kinds:
          - kind: TCPRoute
    - name: tcp-fail
      protocol: TCP
      port: 9001
      allowedRoutes:
        kinds:
          - kind: TCPRoute
    - name: tls
      protocol: TLS
      port: 443
      hostname: abc.example.com
      allowedRoutes:
        kinds:
          - kind: TLSRoute
      tls:
        mode: Passthrough
    - name: udp
      protocol: UDP
      port: 5300
      allowedRoutes:
        kinds:
          - kind: UDPRoute
    - name: udp-fail
      protocol: UDP
      port: 5301
      allowedRoutes:
        kinds:
          - kind: UDPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: nantian-gw
spec:
  parentRefs:
    - name: edge
      sectionName: http
  hostnames:
    - example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-echo
  namespace: nantian-gw
spec:
  parentRefs:
    - name: edge
      sectionName: http
  hostnames:
    - grpc.example.com
  rules:
    - backendRefs:
        - name: grpc-echo
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: tcp-echo
  namespace: nantian-gw
spec:
  parentRefs:
    - name: edge
      sectionName: tcp
  rules:
    - backendRefs:
        - name: echo
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: tcp-missing
  namespace: nantian-gw
spec:
  parentRefs:
    - name: edge
      sectionName: tcp-fail
  rules:
    - backendRefs:
        - name: missing-tcp
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: tls-echo
  namespace: nantian-gw
spec:
  parentRefs:
    - name: edge
      sectionName: tls
  hostnames:
    - abc.example.com
  rules:
    - backendRefs:
        - name: tls-backend
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: udp-coredns
  namespace: nantian-gw
spec:
  parentRefs:
    - name: edge
      sectionName: udp
  rules:
    - backendRefs:
        - name: coredns
          port: 53
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: udp-missing
  namespace: nantian-gw
spec:
  parentRefs:
    - name: edge
      sectionName: udp-fail
  rules:
    - backendRefs:
        - name: missing-udp
          port: 53
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: default-gw
  namespace: nantian-gw
spec:
  gatewayClassName: nantian-gw
  defaultScope: All
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default-gw-route
  namespace: nantian-gw
spec:
  useDefaultGateways: All
  rules:
    - backendRefs:
        - name: echo
          port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ext-auth
  namespace: nantian-gw
spec:
  selector:
    app: ext-auth
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-auth
  namespace: nantian-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-auth
  template:
    metadata:
      labels:
        app: ext-auth
    spec:
      containers:
        - name: ext-auth
          image: m.daocloud.io/docker.io/hashicorp/http-echo:1.0.0
          args:
            - "-listen=:8443"
            - "-text=auth-allowed"
          ports:
            - containerPort: 8443
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: ext-auth-tls
  namespace: nantian-gw
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: ext-auth
      sectionName: https
  validation:
    hostname: ext-auth.nantian-gw.svc.cluster.local
    wellKnownCACertificates: System
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-auth-route
  namespace: nantian-gw
spec:
  parentRefs:
    - name: edge
      sectionName: http
  hostnames:
    - ext-auth.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: ext-auth
              port: 443
            httpAuth:
              path: /check
      backendRefs:
        - name: echo
          port: 8080
