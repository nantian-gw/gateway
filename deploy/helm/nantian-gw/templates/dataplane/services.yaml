{{- if .Values.dataplane.enabled }}
{{- $ns := include "nantian-gw.namespace" . }}
{{- $dpName := include "nantian-gw.name" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $dpName }}-dataplane-admin
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.dataplane.labels" . | nindent 4 }}
    gateway.nantian.dev/service-role: admin
spec:
  selector:
    {{- include "nantian-gw.dataplane.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: 19080
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $dpName }}-dataplane-metrics
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.dataplane.labels" . | nindent 4 }}
    gateway.nantian.dev/service-role: metrics
spec:
  selector:
    {{- include "nantian-gw.dataplane.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 19080
      targetPort: admin
{{- end }}