{{- if .Values.certs.generate }}
{{- $ns := include "nantian-gw.namespace" . }}
{{- $name := include "nantian-gw.name" . }}
{{- $domain := .Values.certs.domain | default (printf "%s-controlplane-grpc.%s.svc.cluster.local" $name $ns) }}
{{- $ca := genCA (printf "%s-ca" $name) 3650 }}
{{- $serverCert := genSignedCert $domain nil (list $domain) 3650 $ca }}
{{- $clientCert := genSignedCert (printf "%s-client" $name) nil nil 3650 $ca }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-grpc-ca
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    gateway.nantian.dev/secret-role: grpc-ca
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca.Cert | b64enc }}
  tls.key: {{ $ca.Key | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-grpc-server-tls
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    gateway.nantian.dev/secret-role: grpc-server
type: kubernetes.io/tls
data:
  tls.crt: {{ $serverCert.Cert | b64enc }}
  tls.key: {{ $serverCert.Key | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-grpc-client-tls
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    gateway.nantian.dev/secret-role: grpc-client
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $clientCert.Cert | b64enc }}
  tls.key: {{ $clientCert.Key | b64enc }}
{{- end }}