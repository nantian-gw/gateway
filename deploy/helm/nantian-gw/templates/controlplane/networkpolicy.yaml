{{- if and .Values.controlplane.enabled .Values.networkPolicies.enabled }}
{{- $ns := include "nantian-gw.namespace" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nantian-gw.name" . }}-controlplane
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.controlplane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nantian-gw.controlplane.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - protocol: TCP
          port: 18080
        - protocol: TCP
          port: 18081
        - protocol: TCP
          port: 18082
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 18083
{{- end }}