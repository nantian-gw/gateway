global:
  commonLabels:
    conponent: nantian-gw
  imagePullSecrets:
    - sycp-sre-pull-secret

namespace:
  create: false
  name: "nantian-gw"

gatewayClass:
  enabled: true
  controllerName: "gateway.networking.k8s.io/nantian-gw"

certs:
  generate: true

controlplane:
  enabled: true
  replicas: 2

  image:
    registry: "harbor.qihoo.net"
    repository: "sycp-sre/nantian-controller"
    tag: "latest"
    pullPolicy: Always

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"

  grpcTLS:
    enabled: true

  config:
    grpcTLS:
      enabled: true
      certPath: "/etc/nantian-gw/grpc-tls/tls.crt"
      keyPath: "/etc/nantian-gw/grpc-tls/tls.key"

dataplane:
  enabled: true
  replicas: 3

  image:
    registry: "harbor.qihoo.net"
    repository: "sycp-sre/nantian-dataplane"
    tag: "latest"
    pullPolicy: Always

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
      add: [NET_BIND_SERVICE]

  resources:
    requests:
      cpu: "2"
      memory: 512Mi
    limits:
      memory: 2Gi

  xdsTLS:
    enabled: true
    domainName: "nantian-controlplane-grpc.nantian-gw.svc.cluster.local"

  sessionPersistence:
    sharedSecret: "lahdo/BRzV7C+P8fqUD0OmABxhMbpBYqOcL4ciZdc00="
    secretKey: "session-persistence"

  config:
    nodeId: "dp-kubernetes"
    cluster: "production"
    controlPlaneAddr: "https://nantian-controlplane-grpc.nantian-gw.svc.cluster.local:18080"
    adminAddr: "0.0.0.0:19080"
    log:
      level: "info,nantian_core::connectors=off"
      format: "json"
      nonBlocking: true
      nonBlockingBufferedLines: 65536
      dropWhenFull: true
    adminAuth:
      bearerToken: ""
      bearerTokenFile: ""
    accessLog:
      enabled: true
      path: "/var/log/nantian-gw/access.log"
      mode: "text"
      format: "%TIMESTAMP% %EVENT% %PROTOCOL% %LISTENER% %CLIENT_IP% %HOST% %METHOD% %PATH% %REQUEST_ID% %ROUTE_NAMESPACE% %ROUTE_NAME% %BACKEND% %STATUS% %LATENCY_MS% %BYTES_RECEIVED% %BYTES_SENT% %SNAPSHOT_VERSION% %RETRY_ATTEMPTS% %RESPONSE_FLAGS%"
      mode: "json"
      sampleRate: 0.01
      routeAnnotationPrefix: "gateway.nantian.dev/access-log-"
    runtime:
      httpListenAddr: "0.0.0.0:10080"
      enableIpv6: true
      enableHttp3: false
      tlsMinVersion: "1.2"
      tlsMaxVersion: "1.3"
    runtimeTuning:
      gracefulDrainPeriodMs: 10000
      workStealing: true
      downstreamTcpFastopen: 1024
      downstreamDscp: 46
      upstreamTcpRecvBuf: 262144
      upstreamTcpFastOpen: true
      upstreamConnectionTimeoutMs: 5000
      upstreamReadTimeoutMs: 30000
      upstreamIdleTimeoutMs: 60000
      upstreamDscp: 46
      upstreamTcpKeepalive:
        enabled: true
      httpCapacity:
        reusePort: true
        upstreamKeepalivePoolSize: 32768
        acceptConcurrency: 16
    xdsTls:
      enabled: true
      caPath: "/etc/nantian-gw/xds-tls/ca.crt"
      certPath: "/etc/nantian-gw/xds-tls/tls.crt"
      keyPath: "/etc/nantian-gw/xds-tls/tls.key"
      domainName: "nantian-controlplane-grpc.nantian-gw.svc.cluster.local"
    sessionPersistence:
      secretKey: ""
      secretKeyFile: "/etc/nantian-gw/session-persistence/session-persistence"

dashboard:
  enabled: true
  replicas: 1
  image:
    registry: "harbor.qihoo.net"
    repository: "sycp-sre/nantian-dashboard"
    tag: "latest"
    pullPolicy: Always

hpa:
  enabled: false

serviceMonitor:
  enabled: false

networkPolicies:
  enabled: true