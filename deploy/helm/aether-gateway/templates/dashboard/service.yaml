{{- if .Values.dashboard.enabled }}
{{- $ns := include "aether-gateway.namespace" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aether-gateway.name" . }}-dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "aether-gateway.dashboard.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "aether-gateway.dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}