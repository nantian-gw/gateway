{{- if and .Values.controlplane.enabled (gt (int .Values.controlplane.replicas) 1) }}
{{- $ns := include "aether-gateway.namespace" . }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aether-gateway.name" . }}-controlplane
  namespace: {{ $ns }}
  labels:
    {{- include "aether-gateway.controlplane.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.controlplane.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "aether-gateway.controlplane.selectorLabels" . | nindent 6 }}
{{- end }}