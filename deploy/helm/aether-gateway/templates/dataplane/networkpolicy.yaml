{{- if and .Values.dataplane.enabled .Values.networkPolicies.enabled }}
{{- $ns := include "aether-gateway.namespace" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aether-gateway.name" . }}-dataplane
  namespace: {{ $ns }}
  labels:
    {{- include "aether-gateway.dataplane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aether-gateway.dataplane.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - protocol: TCP
          port: 19080
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 10080
        - protocol: TCP
          port: 443
{{- end }}