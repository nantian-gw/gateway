{{- if and .Values.dataplane.enabled (gt (int .Values.dataplane.replicas) 1) }}
{{- $ns := include "aether-gateway.namespace" . }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aether-gateway.name" . }}-dataplane
  namespace: {{ $ns }}
  labels:
    {{- include "aether-gateway.dataplane.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.dataplane.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "aether-gateway.dataplane.selectorLabels" . | nindent 6 }}
{{- end }}