# Default values for aether-gateway.
# This is a YAML-formatted file.

# -- Global settings applied across all components
global:
  # -- Global container image registry (prepended to all component images)
  imageRegistry: ""
  # -- Global image pull secrets (names of existing secrets)
  imagePullSecrets: []
  # -- Common labels added to all resources
  commonLabels: {}

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the release
fullnameOverride: ""

# -- Namespace configuration
namespace:
  # -- Create the namespace
  create: true
  # -- Namespace name (ignored if create=false, uses release namespace)
  name: "aether-gateway"

# -- GatewayClass resource
gatewayClass:
  enabled: true
  controllerName: "gateway.networking.k8s.io/aether-gateway"

# -- RBAC configuration (ServiceAccounts, ClusterRole, ClusterRoleBinding)
rbac:
  create: true

# =============================================================================
# Controlplane
# =============================================================================
controlplane:
  # -- Enable controlplane deployment
  enabled: true

  # -- Number of replicas
  replicas: 2

  # -- Container image
  image:
    registry: ""      # Overrides global.imageRegistry for this component
    repository: "aether-gateway-controlplane"
    tag: ""           # Defaults to Chart.appVersion
    pullPolicy: Always

  # -- Pod security context (overrides defaults)
  podSecurityContext: {}
    # runAsNonRoot: true
    # runAsUser: 65532
    # runAsGroup: 65532
    # fsGroup: 65532

  # -- Container security context (overrides defaults)
  containerSecurityContext: {}
    # allowPrivilegeEscalation: false
    # readOnlyRootFilesystem: true

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # -- Probe configuration
  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6

  # -- Strategy for pods (defaults shown below, no 'pods' field needed in values)
  # strategy: {}  # Can be left empty to use defaults

  # -- Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # -- PodDisruptionBudget
  pdb:
    # -- Minimum available pods during voluntary disruptions
    minAvailable: 1

  # -- Topology spread constraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

  # -- Termination grace period (seconds)
  terminationGracePeriodSeconds: 30

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

  # -- Controlplane application config (merged into ConfigMap as config.yaml)
  # @default -- See controlplane-config defaults below
  config:
    grpcAddr: ":18080"
    adminAddr: ":18081"
    metricsAddr: ":18082"
    healthProbeAddr: ":18083"
    controllerName: "gateway.networking.k8s.io/aether-gateway"
    statusAddress: "127.0.0.1"
    syncPeriod: "30s"
    syncSettleDelay: "200ms"
    nodeStatus:
      namespace: ""
      leasePrefix: "aeg-node"
      persistTimeout: "2s"
    adminRuntime:
      readHeaderTimeout: "5s"
      readTimeout: "30s"
      writeTimeout: "30s"
      idleTimeout: "2m"
    log:
      level: "info"
      format: "json"
    leaderElection:
      enabled: true
      id: "aether-gateway-controlplane-leader"
      leaseDuration: "15s"
      renewDeadline: "10s"
      retryPeriod: "2s"
    adminAuth:
      bearerToken: ""
      bearerTokenFile: ""
    grpcTLS:
      enabled: false
      certPath: ""
      keyPath: ""
      clientCAPath: ""
      requireClientCert: false
    grpcRuntime:
      keepaliveTime: "30s"
      keepaliveTimeout: "10s"
      minPingInterval: "15s"
      maxConnectionIdle: "2m"
      maxConnectionAge: "30m"
      maxConnectionAgeGrace: "30s"
      snapshotSendTimeout: "5s"
      snapshotAckTimeout: "30s"
      permitWithoutStream: false
    translatorLimits:
      maxInputObjects: 0
      maxSnapshotObjects: 0
      maxSnapshotEndpoints: 0
    nodeDrift:
      warningThreshold: "15s"
    reconcilerRunner:
      settleDelay: "300ms"
      retryBackoff: "1s"
    adminReadiness:
      mode: "snapshot"

  # -- gRPC TLS configuration
  grpcTLS:
    # -- Enable gRPC mTLS
    enabled: false
    # -- Name of existing Secret containing tls.crt, tls.key, ca.crt
    existingSecret: ""
    # -- Require client certificates
    requireClientCert: false

  # -- Admin API authentication
  adminAuth:
    # -- Bearer token file path inside container
    bearerTokenFile: ""
    # -- Name of existing Secret containing the token
    existingSecret: ""
    # -- Secret key for the token (default: token)
    secretKey: "token"

  # -- Extra environment variables
  extraEnv: []
    # - name: FOO
    #   value: bar

  # -- Extra volume mounts
  extraVolumeMounts: []
  # -- Extra volumes
  extraVolumes: []

# =============================================================================
# Dataplane
# =============================================================================
dataplane:
  # -- Enable dataplane deployment
  enabled: true

  # -- Number of replicas
  replicas: 2

  # -- Container image
  image:
    registry: ""
    repository: "aether-gateway-dataplane"
    tag: ""
    pullPolicy: Always

  # -- Pod security context (overrides defaults)
  podSecurityContext: {}
    # runAsNonRoot: true
    # runAsUser: 65532
    # runAsGroup: 65532
    # fsGroup: 65532

  # -- Container security context (overrides defaults)
  containerSecurityContext: {}
    # allowPrivilegeEscalation: false
    # readOnlyRootFilesystem: true
    # capabilities:
    #   drop: [ALL]
    #   add: [NET_BIND_SERVICE]

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      memory: "1Gi"

  # -- Probe configuration
  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 45
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6

  # -- Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # -- PodDisruptionBudget
  pdb:
    minAvailable: 1

  # -- Topology spread constraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

  # -- Termination grace period (seconds)
  terminationGracePeriodSeconds: 30

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

  # -- Dataplane application config (merged into ConfigMap as config.yaml)
  config:
    nodeId: "dp-kubernetes"
    cluster: "kubernetes"
    controlPlaneAddr: ""
    adminAddr: "0.0.0.0:19080"
    log:
      level: "info,aether_core::connectors=off"
      format: "json"
      nonBlocking: true
      nonBlockingBufferedLines: 65536
      dropWhenFull: true
    adminAuth:
      bearerToken: ""
      bearerTokenFile: ""
    accessLog:
      enabled: true
      path: "/var/log/aether-gateway/access.log"
      format: "%CLIENT_IP% - - [%TIMESTAMP%] \"%REQUEST%\" %STATUS% %BYTES_SENT% \"%REFERER%\" \"%USER_AGENT%\" %LATENCY_MS%ms %UPSTREAM_ADDR% uct=%UPSTREAM_CONNECT_TIME_MS%ms rt=%ROUTE_NAMESPACE%/%ROUTE_NAME% rid=%REQUEST_ID% flags=%RESPONSE_FLAGS% retries=%RETRY_ATTEMPTS% sn=%SNAPSHOT_VERSION%"
      mode: "text"
      sampleRate: 1.0
    runtime:
      httpListenAddr: "0.0.0.0:10080"
      enableIpv6: false
      enableHttp3: false
      tlsMinVersion: "1.2"
      tlsMaxVersion: "1.3"
    runtimeTuning:
      gracefulDrainPeriodMs: 10000
      upstreamTcpFastOpen: true
      upstreamIdleTimeoutMs: 60000
      upstreamTcpKeepalive:
        enabled: true
      # High-concurrency tuning (commented = Aether default)
      # workStealing: true
      # downstreamTcpFastopen: 1024       # TFO backlog; set to enable TCP Fast Open
      # downstreamDscp: 46               # DSCP EF for expedited forwarding
      # upstreamTcpRecvBuf: 262144       # 256KB socket receive buffer
      # upstreamTcpFastOpen: true
      # upstreamConnectionTimeoutMs: 5000
      # upstreamReadTimeoutMs: 30000
      # upstreamIdleTimeoutMs: 60000
      # upstreamDscp: 0
    xdsTls:
      enabled: false
      caPath: ""
      certPath: ""
      keyPath: ""
      domainName: ""

  # -- xDS TLS configuration
  xdsTLS:
    enabled: false
    # -- Name of existing Secret containing tls.crt, tls.key, ca.crt
    existingSecret: ""
    # -- Expected domain name for the controlplane gRPC service
    domainName: ""

  # -- Admin API authentication
  adminAuth:
    bearerTokenFile: ""
    existingSecret: ""
    secretKey: "token"

  # -- Session persistence configuration
  sessionPersistence:
    # -- Shared secret for HMAC-based session keys (enables multi-replica safety)
    sharedSecret: ""
    # -- Name of existing Secret containing session persistence key
    existingSecret: ""
    # -- Secret key for the session persistence token (default: session-persistence)
    secretKey: "session-persistence"

  # -- Extra environment variables
  extraEnv: []
  # -- Extra volume mounts
  extraVolumeMounts: []
  # -- Extra volumes
  extraVolumes: []

  # -- Host network mode (for Kind/low-port binding)
  hostNetwork: false

# =============================================================================
# Dashboard
# =============================================================================
dashboard:
  # -- Enable dashboard deployment
  enabled: true

  # -- Number of replicas
  replicas: 1

  # -- NextAuth secret (64-char hex). If set, a Secret is generated.
  # If not set, use authExistingSecret to reference a pre-created Secret.
  authSecret: ""

  # -- Name of a pre-created Secret (Opaque, key: auth-secret) for AUTH_SECRET.
  # Takes precedence over authSecret if both are set.
  authExistingSecret: ""

  # -- Container image
  image:
    registry: ""
    repository: "aether-gateway-dashboard"
    tag: ""
    pullPolicy: Always

  # -- Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  # -- Container security context
  containerSecurityContext: {}
    # allowPrivilegeEscalation: false
    # readOnlyRootFilesystem: true
    # capabilities:
    #   drop: [ALL]

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

  # -- Probe configuration
  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 20
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3

  # -- Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # -- Topology spread constraints
  topologySpreadConstraints: []

  # -- Termination grace period (seconds)
  terminationGracePeriodSeconds: 20

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

# =============================================================================
# HPA (Horizontal Pod Autoscaler)
# =============================================================================
hpa:
  # -- Enable HPA for the dataplane
  enabled: false
  # -- Minimum replicas
  minReplicas: 2
  # -- Maximum replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilization: 70
  # -- Target memory utilization percentage
  targetMemoryUtilization: 75

# =============================================================================
# ServiceMonitor (Prometheus Operator)
# =============================================================================
serviceMonitor:
  # -- Enable ServiceMonitors for Prometheus operator scraping
  enabled: false
  # -- Labels added to ServiceMonitor resources
  labels: {}
    # release: kube-prometheus-stack
  # -- Scrape interval
  interval: "30s"
  # -- Scrape timeout
  scrapeTimeout: "10s"

# =============================================================================
# NetworkPolicy
# =============================================================================
networkPolicies:
  # -- Enable NetworkPolicies
  enabled: true

# =============================================================================
# Certificate generation (one-time, at install)
# =============================================================================
certs:
  # -- Generate self-signed certificates for gRPC mTLS.
  # When enabled, creates a CA, server cert, and client cert.
  # Disabled by default; use existingSecret for production cert-manager integration.
  generate: false
  # -- Namespace-scoped domain used for gRPC server certificate SAN.
  # Auto-computed from release name + namespace if empty.
  domain: ""