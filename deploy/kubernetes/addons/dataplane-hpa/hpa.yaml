apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nantian-gw-dataplane
  namespace: nantian-gw
  labels:
    app.kubernetes.io/name: nantian-gw
    app.kubernetes.io/part-of: nantian-gw
    app.kubernetes.io/component: dataplane
    gateway.nantian.dev/addon: dataplane-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nantian-gw-dataplane
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
