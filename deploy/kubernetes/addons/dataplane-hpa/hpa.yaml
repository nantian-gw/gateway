apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aether-gateway-dataplane
  namespace: aether-gateway
  labels:
    app.kubernetes.io/name: aether-gateway
    app.kubernetes.io/part-of: aether-gateway
    app.kubernetes.io/component: dataplane
    gateway.nantian.dev/addon: dataplane-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aether-gateway-dataplane
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
