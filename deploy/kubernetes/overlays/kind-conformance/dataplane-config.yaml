node_id: "dp-kind"
cluster: "kind"
control_plane_addr: "http://nantian-gw-controlplane-grpc.nantian-gw.svc.cluster.local:18080"
admin_addr: "0.0.0.0:19080"
log:
  level: "info,nantian_core::connectors=off"
  format: "json"
  non_blocking: true
  non_blocking_buffered_lines: 65536
  drop_when_full: true
admin_auth:
  bearer_token: ""
  bearer_token_file: "/etc/nantian-gw/admin-auth/token"
access_log:
  enabled: false
  path: "stdout"
  format: "%START_TIME% %CLIENT_IP% %HOST% %METHOD% %PATH% %ROUTE_NAME% %BACKEND% %STATUS% %LATENCY_MS%"
runtime:
  enable_ipv6: true
  enable_http3: false
  tls_min_version: "1.2"
  tls_max_version: "1.3"
runtime_tuning:
  graceful_drain_period_ms: 10000
  active_health_check_enabled: true
  active_health_check_interval_ms: 3000
  active_health_check_timeout_ms: 1000
  active_health_check_unhealthy_threshold: 2
xds_tls:
  enabled: false
  ca_path: ""
  cert_path: ""
  key_path: ""
  domain_name: ""
