grpcAddr: ":18080"
adminAddr: ":18081"
metricsAddr: ":18082"
healthProbeAddr: ":18083"
controllerName: "gateway.networking.k8s.io/nantian-gw"
statusAddress: "127.0.0.1"
syncPeriod: 5s
syncSettleDelay: 200ms
nodeStatus:
  namespace: ""
  leasePrefix: "aeg-node"
  persistTimeout: "2s"
adminRuntime:
  readHeaderTimeout: "5s"
  readTimeout: "30s"
  writeTimeout: "30s"
  idleTimeout: "2m"
  dataplaneAggregation:
    serviceName: "nantian-gw-dataplane-admin"
    namespace: "nantian-gw"
    portName: "admin"
    timeout: "2s"
    bearerTokenFile: "/etc/nantian-gw/admin-auth/token"
log:
  level: "info"
  format: "json"
leaderElection:
  enabled: true
  id: "nantian-controlplane-leader"
  leaseDuration: "15s"
  renewDeadline: "10s"
  retryPeriod: "2s"
adminAuth:
  bearerToken: ""
  bearerTokenFile: ""
dashboard:
  enabled: true
  capabilities:
    aiOverview: true
    aiServices: true
    aiTokenPolicies: true
    aiCost: true
    aiTraces: true
    aiUsage: true
    wasmPlugins: true
    chatbot: true
grpcTLS:
  enabled: false
  certPath: ""
  keyPath: ""
  clientCAPath: ""
  requireClientCert: false
features:
  enableAiGateway: false
