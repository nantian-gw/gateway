apiVersion: apps/v1
kind: Deployment
metadata:
  name: nantian-gw-dataplane
  namespace: nantian-gw
spec:
  template:
    spec:
      containers:
      - name: nantian-gw-dataplane
        ports:
        - containerPort: 80
          hostPort: 80
          protocol: TCP
        - containerPort: 443
          hostPort: 443
          protocol: TCP
