apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: aether-gateway-controlplane-config
    namespace: aether-gateway
    behavior: replace
    files:
      - config.yaml=controlplane-config.yaml
  - name: aether-gateway-dataplane-config
    namespace: aether-gateway
    behavior: replace
    files:
      - config.yaml=dataplane-config.yaml