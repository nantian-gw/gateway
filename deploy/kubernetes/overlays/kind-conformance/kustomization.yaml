apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: nantian-controlplane-config
    namespace: nantian-gw
    behavior: replace
    files:
      - config.yaml=controlplane-config.yaml
  - name: nantian-dataplane-config
    namespace: nantian-gw
    behavior: replace
    files:
      - config.yaml=dataplane-config.yaml