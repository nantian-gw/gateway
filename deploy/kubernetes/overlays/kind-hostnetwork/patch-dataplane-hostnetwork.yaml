apiVersion: apps/v1
kind: Deployment
metadata:
  name: nantian-dataplane
  namespace: nantian-gw
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nantian-dataplane
              topologyKey: kubernetes.io/hostname
