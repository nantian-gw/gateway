apiVersion: v1
kind: Secret
metadata:
  name: aether-gateway-controlplane-grpc-tls
  namespace: aether-gateway
  labels:
    app.kubernetes.io/name: aether-gateway
    app.kubernetes.io/part-of: aether-gateway
    app.kubernetes.io/component: controlplane
type: Opaque
stringData:
  tls.crt: |
    replace-with-controlplane-server-certificate
