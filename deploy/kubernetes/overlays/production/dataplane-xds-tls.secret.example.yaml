apiVersion: v1
kind: Secret
metadata:
  name: aether-gateway-dataplane-xds-tls
  namespace: aether-gateway
  labels:
    app.kubernetes.io/name: aether-gateway
    app.kubernetes.io/part-of: aether-gateway
    app.kubernetes.io/component: dataplane
type: Opaque
stringData:
  tls.crt: |
    replace-with-dataplane-client-certificate
  tls.key: |
    replace-with-dataplane-client-private-key
  ca.crt: |
    replace-with-controlplane-ca-bundle
