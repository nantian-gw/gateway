apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../addons/dataplane-hpa

patches:
  - path: patch-controlplane-deployment.yaml
  - path: patch-dataplane-deployment.yaml
  - path: patch-dashboard-deployment.yaml
  # The dataplane HPA owns the replica count here; drop the Deployment's static
  # replicas so apply/GitOps does not fight the autoscaler on every reconcile.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nantian-gw-dataplane
    patch: |-
      - op: remove
        path: /spec/replicas