grpcAddr: ":18080"
adminAddr: ":18081"
metricsAddr: ":18082"
healthProbeAddr: ":18083"
controllerName: "gateway.networking.k8s.io/aether-gateway"
statusAddresses:
  - "replace-me.example.invalid"
syncPeriod: 30s
syncSettleDelay: 200ms
reconcilerRunner:
  settleDelay: "300ms"
  retryBackoff: "1s"
nodeStatus:
  leasePrefix: "aeg-node"
  persistTimeout: "2s"
  persistDebounce: "250ms"
adminReadiness:
  mode: "snapshot"
adminRuntime:
  readHeaderTimeout: "5s"
  readTimeout: "30s"
  writeTimeout: "30s"
  idleTimeout: "2m"
nodeDrift:
  warningThreshold: "15s"
log:
  level: "info"
  format: "json"
  addSource: false
leaderElection:
  enabled: true
  id: "aether-gateway-controlplane-leader"
  leaseDuration: "15s"
  renewDeadline: "10s"
  retryPeriod: "2s"
adminAuth:
  bearerToken: ""
  bearerTokenFile: "/etc/aether-gateway/admin-auth/token"
adminTLS:
  enabled: false
  certPath: ""
  keyPath: ""
grpcTLS:
  enabled: true
  certPath: "/etc/aether-gateway/grpc-tls/tls.crt"
  keyPath: "/etc/aether-gateway/grpc-tls/tls.key"
  clientCAPath: "/etc/aether-gateway/grpc-tls/ca.crt"
  requireClientCert: true
