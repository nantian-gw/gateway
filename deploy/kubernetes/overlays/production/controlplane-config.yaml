grpcAddr: ":18080"
adminAddr: ":18081"
metricsAddr: ":18082"
healthProbeAddr: ":18083"
controllerName: "gateway.networking.k8s.io/nantian-gw"
statusAddresses:
  - "replace-me.example.invalid"
syncPeriod: 30s
syncSettleDelay: 200ms
reconcilerRunner:
  settleDelay: "300ms"
  retryBackoff: "1s"
nodeStatus:
  leasePrefix: "nantian-gw-node"
  persistTimeout: "2s"
  persistDebounce: "250ms"
adminReadiness:
  mode: "snapshot"
adminRuntime:
  readHeaderTimeout: "5s"
  readTimeout: "30s"
  writeTimeout: "30s"
  idleTimeout: "2m"
nodeDrift:
  warningThreshold: "15s"
log:
  level: "info"
  format: "json"
  addSource: false
leaderElection:
  enabled: true
  id: "nantian-controlplane-leader"
  leaseDuration: "15s"
  renewDeadline: "10s"
  retryPeriod: "2s"
adminAuth:
  # authMode: "static" (default) uses the bearer tokens below. Set to
  # "kubernetes" to validate caller tokens via the TokenReview API.
  bearerToken: ""
  bearerTokenFile: "/etc/nantian-gw/admin-auth/token"
  # The following keys apply only when authMode: "kubernetes":
  #   tokenReviewAudiences: audiences a token must be issued for; requests
  #     bearing tokens minted for other audiences are rejected.
  #   allowedUsers / allowedGroups: identities permitted to perform writes.
  #     Reads require only authentication; writes fail closed (403) when both
  #     lists are empty, so at least one must be set to enable mutations.
  # tokenReviewAudiences: ["nantian-controlplane-admin"]
  # allowedGroups: ["platform:admins"]
  # allowedUsers: []
  # trustedProxies: X-Forwarded-For is honored only when the direct peer falls
  #   within one of these CIDRs; otherwise the connection's RemoteAddr is used
  #   as the rate-limit key. Leave empty when clients connect directly.
  # trustedProxies: ["10.0.0.0/8"]
dashboard:
  enabled: true
  capabilities:
    aiOverview: true
    aiServices: true
    aiTokenPolicies: true
    aiCost: true
    aiTraces: true
    aiUsage: true
    wasmPlugins: true
    chatbot: true
adminTLS:
  enabled: false
  certPath: ""
  keyPath: ""
grpcTLS:
  enabled: true
  certPath: "/etc/nantian-gw/grpc-tls/tls.crt"
  keyPath: "/etc/nantian-gw/grpc-tls/tls.key"
  clientCAPath: "/etc/nantian-gw/grpc-tls/ca.crt"
  requireClientCert: true
grpcRuntime:
  maxConcurrentStreams: 250
  gracefulStopTimeout: "5s"
  # Flow-control window sizes are opt-in. Setting an explicit value disables
  # gRPC's automatic BDP window tuning — only override after measuring.
  # initialWindowSize: 4194304      # 4 MB per-stream receive window
  # initialConnWindowSize: 16777216 # 16 MB per-connection receive window
  # maxRecvMsgSize: 16777216        # 16 MB max inbound message
