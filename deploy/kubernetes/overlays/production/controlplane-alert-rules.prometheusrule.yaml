apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aether-gateway-controlplane-alerts
  namespace: aether-gateway
  labels:
    app.kubernetes.io/name: aether-gateway
    app.kubernetes.io/component: controlplane
    app.kubernetes.io/part-of: aether-gateway
spec:
  groups:
    - name: aether-gateway-controlplane
      rules:
        - alert: AetherGatewayControlplaneXDSSnapshotAckTimeouts
          expr: increase(aether_gateway_controlplane_xds_snapshot_ack_timeouts_total[10m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Controlplane is disconnecting stale xDS streams after ACK timeouts
            description: |
              The controlplane observed one or more snapshot ACK timeouts in the last 10 minutes.
              Check /v1/snapshot-sync, /v1/nodes, dataplane reconnect churn, and controlplane logs for slow or stalled consumers.

        - alert: AetherGatewayControlplaneXDSPublishAckLagP99High
          expr: |
            histogram_quantile(
              0.99,
              sum(rate(aether_gateway_controlplane_xds_publish_ack_lag_seconds_bucket[10m])) by (le)
            ) > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Controlplane publish-to-ACK p99 latency is elevated
            description: |
              The p99 latency from snapshot publish to matching ACK has stayed above 5 seconds for 15 minutes.
              Check /v1/snapshot-sync, dataplane readiness, xDS transport stability, and recent snapshot fanout pressure.

        - alert: AetherGatewayControlplaneXDSNackBurst
          expr: increase(aether_gateway_controlplane_xds_publish_nack_lag_seconds_count[10m]) > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Controlplane is seeing repeated xDS NACKs
            description: |
              More than 3 matching xDS NACKs were observed in the last 10 minutes.
              Check /v1/snapshot-sync, dataplane /v1/summary, and controlplane logs for the rejected version and error detail.

        - alert: AetherGatewayControlplaneXDSInvalidRequestBurst
          expr: increase(aether_gateway_controlplane_xds_stream_terminations_total{reason="invalid_request"}[10m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Controlplane is rejecting invalid xDS DiscoveryRequest traffic
            description: |
              One or more xDS streams were terminated with reason="invalid_request" in the last 10 minutes.
              Check dataplane node_id wiring, stream identity stability, and controlplane logs for invalid initial requests or mid-stream node_id changes.

        - alert: AetherGatewayControlplaneXDSStatusReportRejectionBurst
          expr: |
            increase(
              aether_gateway_controlplane_xds_status_report_rejections_total{reason=~"invalid_request|unknown_node"}[10m]
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Controlplane is rejecting dataplane status reports
            description: |
              One or more dataplane status reports were rejected in the last 10 minutes because the payload was invalid
              or the node had not established xDS identity first.
              Check dataplane node_id wiring, xDS reconnect ordering, and controlplane logs for rejected status reports.

        - alert: AetherGatewayControlplaneAdminAPIErrorRateHigh
          expr: |
            (
              sum(rate(aether_gateway_controlplane_admin_requests_total{status_class="5xx"}[10m]))
              /
              clamp_min(sum(rate(aether_gateway_controlplane_admin_requests_total[10m])), 0.001)
            ) > 0.05
            and
            sum(rate(aether_gateway_controlplane_admin_requests_total[10m])) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Controlplane admin API 5xx ratio is elevated
            description: |
              More than 5 percent of controlplane admin API requests returned 5xx responses for 15 minutes.
              Check admin endpoint logs, /v1/infrastructure, /v1/resources hot queries, and upstream Kubernetes API health.

        - alert: AetherGatewayControlplaneNodeStatusPersistQueueBacklogHigh
          expr: |
            max_over_time(aether_gateway_controlplane_node_status_persist_queue_depth[10m]) > 32
            or
            max_over_time(aether_gateway_controlplane_node_status_persist_pending_nodes[10m]) > 32
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Controlplane node status persistence backlog is building up
            description: |
              The node status persistence queue or debounce backlog stayed above 32 items during the last 10 minutes.
              Check Lease write latency, API server health, and whether node churn or reconnect storms are ongoing.

        - alert: AetherGatewayControlplaneNodeStatusPersistDrops
          expr: increase(aether_gateway_controlplane_node_status_persist_dropped_total[10m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Controlplane dropped node status persistence updates
            description: |
              The bounded node status persistence backlog dropped one or more updates in the last 10 minutes.
              Check Lease persistence pressure, queue depth metrics, and controlplane logs before node state divergence grows.
