apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiservices.gateway.nantian.dev
spec:
  group: gateway.nantian.dev
  names:
    plural: aiservices
    singular: aiservice
    kind: AIService
    listKind: AIServiceList
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [provider, model]
            properties:
              provider:
                type: string
              format:
                type: string
              model:
                type: string
              endpoint:
                type: string
              auth:
                type: object
                properties:
                  type:
                    type: string
                  secret:
                    type: string
                  key:
                    type: string
                  header:
                    type: string
              timeout:
                type: string
              retry:
                type: object
                properties:
                  maxRetries:
                    type: integer
                    format: int32
                  backoff:
                    type: string
              observability:
                type: object
                properties:
                  langfuse:
                    type: object
                    properties:
                      host:
                        type: string
                      publicKey:
                        type: string
                      secretKey:
                        type: string
                  otel:
                    type: object
                    properties:
                      endpoint:
                        type: string
                      serviceName:
                        type: string
          status:
            type: object
            properties:
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                  - type
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason, message]
                  properties:
                    type:
                      type: string
                      maxLength: 316
                      pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$"
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
                    message:
                      type: string
                      maxLength: 32768