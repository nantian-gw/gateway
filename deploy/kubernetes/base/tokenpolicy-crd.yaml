apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tokenpolicies.gateway.nantian.dev
spec:
  group: gateway.nantian.dev
  names:
    plural: tokenpolicies
    singular: tokenpolicy
    kind: TokenPolicy
    listKind: TokenPolicyList
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [targetRefs]
            properties:
              targetRefs:
                type: array
                items:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                      maxLength: 253
                    kind:
                      type: string
                      maxLength: 63
                    name:
                      type: string
                      maxLength: 253
                    namespace:
                      type: string
                      maxLength: 63
                  x-kubernetes-preserve-unknown-fields: true
              tokensPerMinute:
                type: integer
                format: int64
                minimum: 0
              tokensPerHour:
                type: integer
                format: int64
                minimum: 0
              requestsPerMinute:
                type: integer
                format: int64
                minimum: 0
              scope:
                type: string
              burst:
                type: number
              onLimit:
                type: string
          status:
            type: object
            properties:
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                  - type
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason, message]
                  properties:
                    type:
                      type: string
                      maxLength: 316
                      pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$"
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
                    message:
                      type: string
                      maxLength: 32768