apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wasmplugins.gateway.aether.dev
spec:
  group: gateway.aether.dev
  names:
    plural: wasmplugins
    singular: wasmplugin
    kind: WasmPlugin
    listKind: WasmPluginList
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [wasm]
            properties:
              wasm:
                type: object
                properties:
                  url:
                    type: string
                  configMap:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      key:
                        type: string
                  inline:
                    type: string
                  sha256:
                    type: string
              targetRefs:
                type: array
                items:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                  x-kubernetes-preserve-unknown-fields: true
              hooks:
                type: array
                items:
                  type: string
                  enum: [onRequest, onResponse, onStreamChunk]
              config:
                type: string
              sandbox:
                type: object
                properties:
                  maxMemoryBytes:
                    type: integer
                    format: int64
                  maxExecutionTimeMs:
                    type: integer
                    format: int64
                  allowNetwork:
                    type: boolean
                  allowFileSystem:
                    type: boolean
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true