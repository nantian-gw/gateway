apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wasmplugins.gateway.nantian.dev
spec:
  group: gateway.nantian.dev
  names:
    plural: wasmplugins
    singular: wasmplugin
    kind: WasmPlugin
    listKind: WasmPluginList
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [wasm]
            properties:
              wasm:
                type: object
                properties:
                  url:
                    type: string
                  configMap:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      key:
                        type: string
                  inline:
                    type: string
                  sha256:
                    type: string
              targetRefs:
                type: array
                items:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                  x-kubernetes-preserve-unknown-fields: true
              hooks:
                type: array
                items:
                  type: string
                  enum: [onRequest, onResponse, onStreamChunk]
              config:
                type: string
              sandbox:
                type: object
                properties:
                  maxMemoryBytes:
                    type: integer
                    format: int64
                  maxExecutionTimeMs:
                    type: integer
                    format: int64
                  allowNetwork:
                    type: boolean
                  allowFileSystem:
                    type: boolean
          status:
            type: object
            properties:
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                  - type
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason, message]
                  properties:
                    type:
                      type: string
                      maxLength: 316
                      pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$"
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
                    message:
                      type: string
                      maxLength: 32768