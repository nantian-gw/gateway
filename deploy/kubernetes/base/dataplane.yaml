apiVersion: apps/v1
kind: Deployment
metadata:
  name: nantian-gw-dataplane
  namespace: nantian-gw
  labels:
    app.kubernetes.io/name: nantian-gw
    app.kubernetes.io/part-of: nantian-gw
    app.kubernetes.io/component: dataplane
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nantian-gw-dataplane
  template:
    metadata:
      labels:
        app: nantian-gw-dataplane
        app.kubernetes.io/name: nantian-gw
        app.kubernetes.io/part-of: nantian-gw
        app.kubernetes.io/component: dataplane
    spec:
      serviceAccountName: nantian-gw-dataplane
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        sysctls:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nantian-gw-dataplane
      containers:
        - name: dataplane
          image: nantian-dataplane:dev
          imagePullPolicy: Always
          env:
            # NANTIAN_GW_NODE_ID is the canonical name; keep AEG_NODE_ID for
            # backward compatibility with older dataplane images that predate
            # the AEG_* → NANTIAN_GW_* rename.
            - name: NANTIAN_GW_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AEG_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          args:
            - "--config"
            - "/etc/nantian-gw/config.yaml"
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: admin
              containerPort: 19080
          startupProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /etc/nantian-gw
              readOnly: true
            - name: xds-tls
              mountPath: /etc/nantian-gw/xds-tls
              readOnly: true
            - name: admin-auth
              mountPath: /etc/nantian-gw/admin-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: nantian-gw-dataplane-config
        - name: xds-tls
          secret:
            secretName: nantian-gw-dataplane-xds-tls
            optional: true
        - name: admin-auth
          secret:
            secretName: nantian-gw-dataplane-admin-auth
            optional: true
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nantian-gw-dataplane
  namespace: nantian-gw
  labels:
    app.kubernetes.io/name: nantian-gw
    app.kubernetes.io/part-of: nantian-gw
    app.kubernetes.io/component: dataplane
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nantian-gw-dataplane
