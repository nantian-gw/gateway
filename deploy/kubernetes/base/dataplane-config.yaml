nodeId: "dp-kind"
cluster: "kind"
controlPlaneAddr: "http://aether-gateway-controlplane-grpc.aether-gateway.svc.cluster.local:18080"
adminAddr: "0.0.0.0:19080"
log:
  level: "info,aether_core::connectors=off"
  format: "json"
  nonBlocking: true
  nonBlockingBufferedLines: 65536
  dropWhenFull: true
adminAuth:
  bearerToken: ""
  bearerTokenFile: ""
accessLog:
  enabled: false
  path: "stdout"
  format: "%START_TIME% %CLIENT_IP% %HOST% %METHOD% %PATH% %ROUTE_NAME% %BACKEND% %STATUS% %LATENCY_MS%"
runtime:
  httpListenAddr: "0.0.0.0:10080"
  enableIpv6: false
  enableHttp3: false
  tlsMinVersion: "1.2"
  tlsMaxVersion: "1.3"
runtimeTuning:
  gracefulDrainPeriodMs: 10000
  upstreamTcpFastOpen: true
xdsTls:
  enabled: false
  caPath: ""
  certPath: ""
  keyPath: ""
  domainName: ""
experimental:
  enableExperimentalGateway: false
  enableAiGateway: false
