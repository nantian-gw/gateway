apiVersion: apps/v1
kind: Deployment
metadata:
  name: nantian-gw-controlplane
  namespace: nantian-gw
  labels:
    app.kubernetes.io/name: nantian-gw
    app.kubernetes.io/part-of: nantian-gw
    app.kubernetes.io/component: controlplane
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nantian-gw-controlplane
  template:
    metadata:
      labels:
        app: nantian-gw-controlplane
        app.kubernetes.io/name: nantian-gw
        app.kubernetes.io/part-of: nantian-gw
        app.kubernetes.io/component: controlplane
    spec:
      serviceAccountName: nantian-gw-controlplane
      priorityClassName: nantian-gw-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nantian-gw-controlplane
      containers:
        - name: controlplane
          image: ghcr.io/nantian-gw/nantian-controlplane:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - "-config"
            - "/etc/nantian-gw/config.yaml"
          ports:
            - name: grpc
              containerPort: 18080
            - name: admin
              containerPort: 18081
            - name: metrics
              containerPort: 18082
            - name: healthz
              containerPort: 18083
          startupProbe:
            httpGet:
              path: /readyz
              port: healthz
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nantian-gw
              readOnly: true
            - name: grpc-tls
              mountPath: /etc/nantian-gw/grpc-tls
              readOnly: true
            - name: admin-auth
              mountPath: /etc/nantian-gw/admin-auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nantian-gw-controlplane-config
        - name: grpc-tls
          secret:
            secretName: nantian-gw-controlplane-grpc-tls
            optional: true
        - name: admin-auth
          secret:
            secretName: nantian-gw-controlplane-admin-auth
            optional: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nantian-gw-controlplane
  namespace: nantian-gw
  labels:
    app.kubernetes.io/name: nantian-gw
    app.kubernetes.io/part-of: nantian-gw
    app.kubernetes.io/component: controlplane
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nantian-gw-controlplane
