apiVersion: v1
kind: Service
metadata:
  name: nantian-controlplane-grpc
  namespace: nantian-gw
  labels:
    app.kubernetes.io/name: nantian-gw
    app.kubernetes.io/part-of: nantian-gw
    app.kubernetes.io/component: controlplane
    gateway.nantian.dev/service-role: grpc
spec:
  selector:
    app: nantian-controlplane
  ports:
    - name: grpc
      port: 18080
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: nantian-controlplane-admin
  namespace: nantian-gw
  labels:
    app.kubernetes.io/name: nantian-gw
    app.kubernetes.io/part-of: nantian-gw
    app.kubernetes.io/component: controlplane
    gateway.nantian.dev/service-role: admin
spec:
  selector:
    app: nantian-controlplane
  ports:
    - name: admin
      port: 18081
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: nantian-controlplane-metrics
  namespace: nantian-gw
  labels:
    app.kubernetes.io/name: nantian-gw
    app.kubernetes.io/part-of: nantian-gw
    app.kubernetes.io/component: controlplane
    gateway.nantian.dev/service-role: metrics
spec:
  selector:
    app: nantian-controlplane
  ports:
    - name: metrics
      port: 18082
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nantian-controlplane
  namespace: nantian-gw
  labels:
    app.kubernetes.io/name: nantian-gw
    app.kubernetes.io/part-of: nantian-gw
    app.kubernetes.io/component: controlplane
spec:
  podSelector:
    matchLabels:
      app: nantian-controlplane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nantian-gw
      ports:
        - protocol: TCP
          port: 18080
        - protocol: TCP
          port: 18081
        - protocol: TCP
          port: 18082
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 18083
---
