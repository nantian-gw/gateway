apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nantian-controlplane
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - nantian-gw
  selector:
    matchLabels:
      app.kubernetes.io/component: controlplane
      gateway.nantian.dev/service-role: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
