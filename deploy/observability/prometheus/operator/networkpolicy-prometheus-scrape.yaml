apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nantian-gw-prometheus-scrape
  namespace: nantian-gw
  labels:
    app.kubernetes.io/name: nantian-gw
    app.kubernetes.io/part-of: nantian-gw
    app.kubernetes.io/component: observability
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - nantian-gw-controlplane
          - nantian-gw-dataplane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 18082
        - protocol: TCP
          port: 19080
