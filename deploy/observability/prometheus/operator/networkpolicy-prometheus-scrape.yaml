apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aether-gateway-prometheus-scrape
  namespace: aether-gateway
  labels:
    app.kubernetes.io/name: aether-gateway
    app.kubernetes.io/part-of: aether-gateway
    app.kubernetes.io/component: observability
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - aether-gateway-controlplane
          - aether-gateway-dataplane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 18082
        - protocol: TCP
          port: 19080
