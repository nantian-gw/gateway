apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nantian-dataplane
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - nantian-gw
  selector:
    matchLabels:
      app: nantian-dataplane
  podMetricsEndpoints:
    - port: admin
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      authorization:
        type: Bearer
        credentials:
          name: nantian-dataplane-admin-token
          key: token
