apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nantian-gw-controlplane
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - nantian-gw
  selector:
    matchLabels:
      app: nantian-gw-controlplane
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
