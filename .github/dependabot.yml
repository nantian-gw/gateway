version: 2

updates:
  # GitHub Actions workflow dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"

  # Go control plane modules.
  - package-ecosystem: "gomod"
    directory: "/controlplane"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(go)"

  # Rust data plane workspace crates.
  - package-ecosystem: "cargo"
    directory: "/dataplane"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(rust)"

# Docker is intentionally not enabled here.
# The current Dockerfiles use ARG-based image references in FROM and multi-stage
# builds, which GitHub documents as limited / unsupported for Dependabot Docker
# version updates.
