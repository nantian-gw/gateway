name: CodeQL

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "Makefile"
      - "**"
      - "proto/**"
      - "tests/conformance-harness/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "Makefile"
      - "**"
      - "proto/**"
      - "tests/conformance-harness/**"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ !github.event.repository.private || vars.ENABLE_PRIVATE_CODEQL == 'true' }}
    name: Analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/conformance-harness/go.sum

      - name: Install Go build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Build Go targets for analysis
        env:
          GOPROXY: https://proxy.golang.org,direct
          GODEBUG: http2client=0
        run: |
          make proto
          cd controlplane
          go build ./...
          cd ../tests/conformance-harness
          go test ./... -run '^$'

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:go