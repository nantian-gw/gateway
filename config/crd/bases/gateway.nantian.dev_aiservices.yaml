apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiservices.gateway.nantian.dev
spec:
  group: gateway.nantian.dev
  names:
    plural: aiservices
    singular: aiservice
    kind: AIService
    listKind: AIServiceList
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [provider, model]
            properties:
              provider:
                type: string
              format:
                type: string
              model:
                type: string
              auth:
                type: object
                properties:
                  type:
                    type: string
                  secret:
                    type: string
                  key:
                    type: string
                  header:
                    type: string
              timeout:
                type: string
              retry:
                type: object
                properties:
                  maxRetries:
                    type: integer
                    format: int32
                  backoff:
                    type: string
              observability:
                type: object
                properties:
                  langfuse:
                    type: object
                    properties:
                      host:
                        type: string
                      publicKey:
                        type: string
                      secretKey:
                        type: string
                  otel:
                    type: object
                    properties:
                      endpoint:
                        type: string
                      serviceName:
                        type: string
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true