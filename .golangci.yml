version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - gocritic
    - misspell
    - unconvert
    - prealloc
    - bodyclose
    - noctx
    - sqlclosecheck
    - nilerr
    - durationcheck
    - errorlint
    - copyloopvar
    - gosec
    - revive
    - goconst
    - unparam
    - dupl
    - gofumpt
    - whitespace
    - nolintlint
    - wrapcheck

  settings:
    errcheck:
      check-blank: true
    goimports:
      local-prefixes: github.com/nantian-gw/gateway
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 4
    wrapcheck:
      ignore-sigs:
        - google.golang.org/grpc/status.Error
        - google.golang.org/grpc/status.Errorf
        - fmt.Errorf
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    paths:
      - internal/gen
      - third_party
      - vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
