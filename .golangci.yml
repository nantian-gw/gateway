version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - gocritic
    - misspell
    - unconvert
    - prealloc
    - bodyclose
    - noctx
    - sqlclosecheck
    - nilerr
    - durationcheck
    - errorlint
    - copyloopvar
    - gosec
    - revive
    - goconst
    - unparam

  settings:
    errcheck:
      check-blank: true
    goimports:
      local-prefixes: github.com/nantian-gw/gateway
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style

  exclusions:
    generated: lax
    paths:
      - internal/gen
      - third_party
      - vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0