version: "2"

run:
  skip-dirs:
    - internal/gen
    - third_party
    - vendor
    - cmd/gateway-api-support
    - cmd/grpc-smoke-client

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - unconvert
    - prealloc
    - bodyclose
    - noctx
    - sqlclosecheck
    - nilerr
    - durationcheck
    - errorlint
    - copyloopvar
    - gosec
    - revive
    - goconst
    - unparam
    - dupl
    - whitespace
    - nolintlint
    - wrapcheck

  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 6
    wrapcheck:
      ignore-sigs:
        - google.golang.org/grpc/status.Error
        - google.golang.org/grpc/status.Errorf
        - fmt.Errorf
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      config:
        G115: "0"  # G115: integer overflow — all are false positives for uint32 conversions from validated values

  exclusions:
    generated: lax
    paths:
      - internal/gen
      - third_party
      - vendor

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/nantian-gw/gateway
  exclusions:
    paths:
      - internal/gen
      - third_party
      - vendor

issues:
  max-issues-per-linter: 5000
  max-same-issues: 5000
